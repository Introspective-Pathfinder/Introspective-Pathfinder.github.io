<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Viewer</title>
<style>
  :root {
    --bg: #fdfdfb;
    --text: #232320;
    --muted: #7a7972;
    --border: #e4e2da;
    --title: #0b6e4f;
  }
  html[data-theme="dark"] {
    --bg: #17181a;
    --text: #dcdad2;
    --muted: #8a8880;
    --border: #2c2d2f;
    --title: #4caf87;
  }
  html[data-theme="sepia"] {
    --bg: #f2e8d5;
    --text: #40371f;
    --muted: #8c7c54;
    --border: #ddcda5;
    --title: #0b6e4f;
  }

  * { box-sizing: border-box; }

  body {
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .back {
    display: inline-block;
    margin-bottom: 24px;
    color: var(--muted);
    text-decoration: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
  }
  .back:hover { color: var(--title); }

  h1 {
    font-size: 22px;
    font-weight: 400;
    color: var(--title);
    margin: 0 0 24px;
  }

  embed {
    width: 100%;
    height: 85vh;
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .fallback {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    color: var(--muted);
    margin-top: 12px;
  }
  .fallback a { color: var(--title); }
</style>
</head>
<body>

<a class="back" href="index.html">&larr; Back to list</a>
<h1 id="doc-title">Loading…</h1>

<embed id="pdf-embed" type="application/pdf">

<p class="fallback">
  If the document doesn't display, <a id="fallback-link" href="#">open it directly</a>.
</p>

<script>
const params = new URLSearchParams(window.location.search);
const file = params.get("file");
const title = params.get("title") || "Untitled";

document.getElementById("doc-title").textContent = title;

if (file) {
  document.getElementById("pdf-embed").setAttribute("src", file);
  document.getElementById("fallback-link").setAttribute("href", file);
} else {
  document.getElementById("doc-title").textContent = "No document specified.";
}

function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme === 'light' ? '' : theme);
}
setTheme(localStorage.getItem('theme') || 'light');
</script>

</body>
</html>
